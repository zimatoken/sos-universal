<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Red circle background -->
  <circle cx="50" cy="50" r="45" fill="#ef4444" stroke="#dc2626" stroke-width="3"/>
  
  <!-- White cross -->
  <g fill="white">
    <!-- Vertical bar -->
    <rect x="42" y="20" width="16" height="60" rx="2"/>
    <!-- Horizontal bar -->
    <rect x="20" y="42" width="60" height="16" rx="2"/>
  </g>
  
  <!-- SOS text below -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SOS</text>
</svg>