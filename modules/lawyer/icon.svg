<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Purple circle background -->
  <circle cx="50" cy="50" r="45" fill="#a855f7" stroke="#7c3aed" stroke-width="3"/>
  
  <!-- White justice/lawyer icon (scales of justice) -->
  <g fill="white" transform="translate(25, 30) scale(0.5)">
    <!-- Base/stand -->
    <rect x="40" y="70" width="20" height="6" rx="2"/>
    <rect x="47" y="50" width="6" height="20"/>
    
    <!-- Balance beam -->
    <rect x="25" y="48" width="50" height="5" rx="2"/>
    
    <!-- Left scale pan (золото/весы) -->
    <circle cx="15" cy="35" r="12" fill="none" stroke="white" stroke-width="3"/>
    <line x1="15" y1="23" x2="15" y2="35" stroke="white" stroke-width="2"/>
    
    <!-- Right scale pan -->
    <circle cx="85" cy="35" r="12" fill="none" stroke="white" stroke-width="3"/>
    <line x1="85" y1="23" x2="85" y2="35" stroke="white" stroke-width="2"/>
    
    <!-- Center decoration -->
    <circle cx="50" cy="40" r="4" fill="#a855f7"/>
  </g>
  
  <!-- LAWYER text below -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LAWYER</text>
</svg>
