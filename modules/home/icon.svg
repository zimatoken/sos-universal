<!-- icon.svg for HOME module -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Green circle background -->
  <circle cx="50" cy="50" r="45" fill="#10b981" stroke="#059669" stroke-width="3"/>
  
  <!-- White house icon -->
  <g fill="white" transform="translate(25, 28) scale(0.65)">
    <!-- Roof -->
    <polygon points="2,16 37,2 72,16" stroke="white" stroke-width="2" fill="none"/>
    <!-- Main body -->
    <rect x="10" y="16" width="54" height="42" rx="2" fill="white"/>
    <!-- Door -->
    <rect x="28" y="36" width="18" height="22" rx="2" fill="#10b981"/>
    <!-- Door knob -->
    <circle cx="42" cy="47" r="2" fill="white"/>
    <!-- Windows -->
    <rect x="16" y="22" width="12" height="10" rx="1" fill="#10b981"/>
    <rect x="46" y="22" width="12" height="10" rx="1" fill="#10b981"/>
    <!-- Window panes -->
    <line x1="22" y1="22" x2="22" y2="32" stroke="#10b981" stroke-width="1.5"/>
    <line x1="16" y1="27" x2="28" y2="27" stroke="#10b981" stroke-width="1.5"/>
    <line x1="52" y1="22" x2="52" y2="32" stroke="#10b981" stroke-width="1.5"/>
    <line x1="46" y1="27" x2="58" y2="27" stroke="#10b981" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="56" y="6" width="8" height="12" rx="1" fill="white"/>
    <!-- Smoke -->
    <circle cx="62" cy="3" r="2.5" fill="white" opacity="0.7"/>
    <circle cx="66" cy="1" r="2" fill="white" opacity="0.5"/>
  </g>
  
  <!-- HOME text below -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">HOME</text>
</svg>