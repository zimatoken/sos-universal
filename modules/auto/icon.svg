<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Blue circle background -->
  <circle cx="50" cy="50" r="45" fill="#3b82f6" stroke="#2563eb" stroke-width="3"/>
  
  <!-- White car icon -->
  <g fill="white" transform="translate(25, 35) scale(0.5)">
    <!-- Car body -->
    <path d="M10 50 L10 40 Q10 30 20 30 L80 30 Q90 30 90 40 L90 50 L90 55 Q90 60 85 60 L15 60 Q10 60 10 55 Z"/>
    <!-- Windows -->
    <path d="M20 32 L25 25 L75 25 L80 32 Z" fill="#3b82f6"/>
    <!-- Wheels -->
    <circle cx="25" cy="55" r="8" fill="#1e293b"/>
    <circle cx="75" cy="55" r="8" fill="#1e293b"/>
    <!-- Headlights -->
    <circle cx="12" cy="42" r="3" fill="#fbbf24"/>
    <circle cx="88" cy="42" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- SOS text below -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AUTO</text>
</svg>