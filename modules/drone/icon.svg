<!-- icon.svg for DRONE module -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Orange circle background -->
  <circle cx="50" cy="50" r="45" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
  
  <!-- White drone (UAV) icon -->
  <g fill="white" transform="translate(25, 28) scale(0.6)">
    <!-- Drone body -->
    <rect x="15" y="28" width="40" height="14" rx="4" fill="white"/>
    <!-- Drone arms -->
    <line x1="15" y1="32" x2="5" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="32" x2="65" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="5" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="40" x2="65" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Propellers -->
    <circle cx="5" cy="20" r="6" fill="white" opacity="0.3"/>
    <circle cx="65" cy="20" r="6" fill="white" opacity="0.3"/>
    <circle cx="5" cy="52" r="6" fill="white" opacity="0.3"/>
    <circle cx="65" cy="52" r="6" fill="white" opacity="0.3"/>
    <!-- Camera -->
    <circle cx="35" cy="42" r="3" fill="#f59e0b"/>
    <!-- Rotor blades (spinning effect) -->
    <path d="M2 17 L8 23 M8 17 L2 23" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M62 17 L68 23 M68 17 L62 23" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M2 49 L8 55 M8 49 L2 55" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M62 49 L68 55 M68 49 L62 55" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- DRONE text below -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DRONE</text>
</svg>